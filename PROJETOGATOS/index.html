<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal dos Gatos</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <nav>
            <img src="imagens/Gemini_Generated_Image_it1yu0it1yu0it1y.jpg" alt="Logo Cats" class="logocats">
            <ul class="menu">
                <li><a href="#home">Home</a></li>
                <li><a href="#racas">Raças</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="mensagem">Escolha uma opção abaixo para buscar o seu felino favorito!</div>
        
        <div style="margin-bottom: 24px;">
            <select name="racas" id="raca-select">
                <option value="">Todas as raças</option>
            </select>
            <button id="btn-buscar">Buscar Gato</button>
        </div>

        <div id="gato-info" style="margin-top: 24px; font-weight: bold; color: #1d2433;"></div>

        <div style="margin-top: 16px; display: flex; justify-content: center;">
            <img src="" alt="Foto de um gato" id="gato-img" style="display: none;">
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
